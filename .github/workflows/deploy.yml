name: Deploy to production

concurrency:
  group: production-deployment
  cancel-in-progress: false # Set to false so we don't interrupt a Docker build mid-way

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      commit_hash:
        description: "Specific commit hash to deploy (leave blank for latest)"
        required: false
        type: string

jobs:
  frontend-ci:
    uses: ./.github/workflows/_frontend-ci.yml

  backend-ci:
    uses: ./.github/workflows/_backend-ci.yml

  deploy:
    needs: [frontend-ci, backend-ci]
    runs-on: self-hosted
    steps:
      - name: Pull code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.commit_hash || github.sha }}

      - name: Set up environment
        run: |
          cp ~/env/backend.env ./backend/.env
          cp ~/env/frontend.env ./frontend/.env

      - name: Deploy
        env:
          FRONTEND_CONTAINER_NAME: healthtech-prd-frontend-1
          BACKEND_CONTAINER_NAME: healthtech-prd-backend-1
          TRAEFIK_CONTAINER_NAME: healthtech-prd-traefik-1
          DB_CONTAINER_NAME: healthtech-prd-db-1
        run: |
          COMPOSE="docker compose --env-file ./backend/.env --env-file ./frontend/.env -f docker-compose.prd.yml"

          echo "Rebuilding and deploying..."
          # `up` starts db -> db-init (creates login/aggregate databases) -> db-migrator (3 contexts) -> backend.
          # If db-init or db-migrator fails, `up` fails and the backend is never started.
          if ! $COMPOSE up --build -d; then
              echo "Deployment failed. Printing database init and migration logs:"
              $COMPOSE logs --no-color --tail 50 db-init db-migrator || true
              exit 1
          fi

          # Simple health check
          sleep 15
          for NAME in "$DB_CONTAINER_NAME" "$TRAEFIK_CONTAINER_NAME" "$BACKEND_CONTAINER_NAME" "$FRONTEND_CONTAINER_NAME"; do
              if [ "$(docker inspect -f '{{.State.Running}}' "$NAME")" == "false" ]; then
                  echo "$NAME failed to start after 15s. Printing logs:"
                  docker logs "$NAME" | tail -n 20
                  exit 1
              fi
          done

          echo "Deployment successful. Cleaning up old images..."
          docker image prune -f
